services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ${MEMO_IMAGE:-yeongdu-memo:local}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/memo.db
      TRUST_PROXY: ${TRUST_PROXY:-}
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-filesystem}
      ATTACHMENT_PATH: /data/attachments
      ATTACHMENT_QUOTA_BYTES: ${ATTACHMENT_QUOTA_BYTES:-1073741824}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PREFIX: ${S3_PREFIX:-yeongdu-memo}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - memo-data:/data
    ports:
      - '127.0.0.1:${MEMO_PORT:-3000}:3000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 20s
volumes:
  memo-data:
